
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          # Windows에서 복사한 경우 섞이는 \r 제거
          printf '%s\n' "$DOTENV" | tr -d '\r' > .env

      - name: Validate .env
        run: |
          for key in API_BASE_URL DEBATE_WEBSOCKET_BASE_URL WEBSOCKET_BASE_URL; do
            value=$(grep -E "^${key}=" .env | head -n1 | cut -d= -f2-)
            if ! printf '%s' "$value" | grep -Eq '^(https?|wss?)://[^[:space:]]+$'; then
              echo "::error::${key} is missing or not a valid URL in DOTENV secret"
              exit 1
            fi
            echo "${key}: OK"
          done

      - name: Build iOS
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env --dart-define=SHOW_ERROR_DETAIL=true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr app.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa
